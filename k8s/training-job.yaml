apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-training-job
  namespace: ml-training
spec:
  template:
    metadata:
      labels:
        app: pytorch-training
    spec:
      restartPolicy: Never
      containers:
      - name: training-container
        image: mlops-train:v1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: config-volume
          mountPath: /app/configs
        - name: data-storage
          mountPath: /app/data
        - name: checkpoint-storage
          mountPath: /app/checkpoints
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        accelerator: gpu
      volumes:
      - name: config-volume
        configMap:
          name: training-config
      - name: data-storage
        persistentVolumeClaim:
          claimName: data-pvc
      - name: checkpoint-storage
        persistentVolumeClaim:
          claimName: checkpoints-pvc
